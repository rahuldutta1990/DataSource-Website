<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 138" fill="none">
  <defs>
    <linearGradient id="kv-shaft" x1="110" y1="100" x2="170" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00B4D8" />
      <stop offset="1" stop-color="#0077FF" />
    </linearGradient>
  </defs>

  <!-- Left Emblem: Matrix & Arrow -->
  <g transform="translate(10, -22)">
    <!-- Col 1 (faint cyan) -->
    <rect x="20" y="90" width="18" height="18" rx="4" fill="#BAEEFB" fill-opacity="0.75" />
    <rect x="20" y="114" width="18" height="18" rx="4" fill="#BAEEFB" fill-opacity="0.75" />

    <!-- Col 2 (soft cyan) -->
    <rect x="44" y="66" width="18" height="18" rx="4" fill="#67E8F9" />
    <rect x="44" y="90" width="18" height="18" rx="4" fill="#67E8F9" />
    <rect x="44" y="114" width="18" height="18" rx="4" fill="#67E8F9" />

    <!-- Col 3 (vibrant cyan) -->
    <rect x="68" y="42" width="18" height="18" rx="4" fill="#38BDF8" />
    <rect x="68" y="66" width="18" height="18" rx="4" fill="#38BDF8" />
    <rect x="68" y="90" width="18" height="18" rx="4" fill="#38BDF8" />
    <rect x="68" y="114" width="18" height="18" rx="4" fill="#38BDF8" />

    <!-- Col 4 (sky blue) -->
    <rect x="92" y="66" width="18" height="18" rx="4" fill="#00A3FF" />
    <rect x="92" y="114" width="18" height="18" rx="4" fill="#00A3FF" />

    <!-- Arrow Shaft -->
    <rect x="110" y="86" width="60" height="28" rx="14" fill="url(#kv-shaft)" />

    <!-- Solid Chevron Arrow Head -->
    <path d="M148 44 C152 40 159 40 163 44 L216 95 C219 98 219 104 216 107 L163 158 C159 162 152 162 148 158 C144 154 144 147 148 143 L195 101 L148 59 C144 55 144 48 148 44 Z" fill="#0062F5" />
  </g>

  <!-- Typography -->
  <g transform="translate(248, 0)">
    <text x="0" y="76" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" letter-spacing="-0.03em" fill="#0F172A">Kernel<tspan fill="#0080FF">Vane</tspan></text>
    <text x="2" y="114" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="18.5" letter-spacing="0.28em" fill="#1E293B">I T   C O N S U L T I N G   &amp;   S O F T W A R E</text>
  </g>
</svg>
